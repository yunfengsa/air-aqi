description="生成AQI数据的展示页面（首页）"
prompt = """
请生成一个用于展示AQI（空气质量指数）数据的网页页面代码。当前可以只展示济南的数据就好，后续需要可以扩展到更多城市。
AQI环境相关的接口定义在.gemini/commands/aqi-api.md中，请参考该文件中的接口说明和示例数据来获取所需的信息。
页面应包含以下内容：
1. 页面标题为“空气质量指数（AQI）展示”。
2. 显示济南的当前AQI值及其对应的空气质量等级（如“优”、“良”、“轻度污染”等）。
3. 使用图表或颜色编码来直观展示AQI数据。
4. 页面应具有良好的用户体验和响应式设计，适应不同设备的浏览。
请确保代码结构清晰，易于维护和扩展。

特别强调：
- 请确保页面代码中不包含任何API密钥或敏感信息。
- 请勿在代码中硬编码任何数据，所有数据应通过调用接口动态获取。对于当天的数据多次请求需要进行缓存处理，避免重复请求接口。
- 请使用现代的前端技术和最佳实践来实现页面。必须在电脑端和移动端均能良好展示。且在一屏内展示。
- 对于接口的获取到的数据，要完整展示，不要遗漏任何字段。在页面实践过程中，对于一些概念性的词汇，要有解释性文案。
"""